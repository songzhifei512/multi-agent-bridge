# Bundle patch layer: config overrides for the dsh-bridge-panel plugin.
# NOTE: The plugin itself is auto-loaded by DSH when the package is installed
# as a dependency. Do NOT insert id: dsh-bridge-panel here — it would cause
# "duplicate loader entry id" error because the package is already registered.
# Use this file only for config overrides and dependency injections.

- override:
    - id: dsh-bridge-panel
      config:
        autoStart: true
        port: 3000
